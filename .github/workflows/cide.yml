name: Test CI-CD Pipeline

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code onto the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Print a sample message to verify the pipeline runs
    - name: Run a Visual Check
      run: |
        echo "The workflow has triggered successfully!"
        echo "Running tests..."
